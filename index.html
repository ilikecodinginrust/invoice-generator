<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Simple Invoice Generator — $19</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem}input,textarea{width:100%;padding:.5rem;margin:.25rem 0}@media print{button,.no-print{display:none}}</style>
</head>
<body>
<h1>Invoice Generator</h1>
<p class="no-print">Free demo. Sell hosted version for $19-49/mo. Print/Save-as-PDF to deliver.</p>
<label>From<textarea id="from" rows="2">Your Company</textarea></label>
<label>To<textarea id="to" rows="2">Client</textarea></label>
<label>Items (description,qty,price per line)<textarea id="items" rows="4">Design,2,150
Hosting,1,49</textarea></label>
<button onclick="render()">Generate</button>
<button onclick="window.print()">Print / PDF</button>
<div id="out"></div>
<script>
function render(){const from=document.getElementById('from').value;const to=document.getElementById('to').value;let total=0;const rows=document.getElementById('items').value.split('\n').map(l=>{const[d,q,p]=l.split(',');const t=parseFloat(q)*parseFloat(p);total+=t;return '<tr><td>'+d+'</td><td>'+q+'</td><td>$'+parseFloat(p).toFixed(2)+'</td><td>$'+t.toFixed(2)+'</td></tr>';}).join('');document.getElementById('out').innerHTML='<hr><p><b>From:</b> '+from+'<br><b>To:</b> '+to+'</p><table border=1 cellpadding=6><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>'+rows+'</table><h3>Total: $'+total.toFixed(2)+'</h3>';}
render();
</script>
</body>
</html>
